<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grafio Creative Studio — HRMS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f8fb;
    --surface: #ffffff;
    --surface-soft: #f8fafc;
    --ink: #111827;
    --ink-soft: #64748b;
    --ink-faint: #94a3b8;
    --border: #e7ebf0;
    --sidebar: #202020;
    --sidebar-2: #292929;
    --sidebar-text: #94a3b8;
    --sidebar-text-active: #ffffff;
    --accent: #C01D00;
    --accent-dark: #8F1600;
    --accent-bright: #E13A1F;
    --accent-soft: #FBE8E4;
    --danger: #dc2626;
    --warning: #d97706;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    font-family: var(--font-body);
    background:
      radial-gradient(circle at 85% 0%, rgba(20,184,166,.06), transparent 26rem),
      var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,h4,.font-display {
    font-family: var(--font-display);
    letter-spacing: -.025em;
  }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* ---------- App shell ---------- */
  .sidebar {
    width: 248px !important;
    background: linear-gradient(180deg, var(--sidebar) 0%, #181818 100%);
    border-right: 1px solid rgba(255,255,255,.05);
    box-shadow: 8px 0 30px rgba(15,23,42,.05);
  }
  .nav-group-label {
    color: #64748b;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: 0 14px;
    margin-top: 22px;
    margin-bottom: 7px;
  }
  .nav-item {
    display:flex;
    align-items:center;
    gap:11px;
    min-height:40px;
    padding: 9px 13px;
    border-radius: 10px;
    color: var(--sidebar-text);
    font-size: 13px;
    font-weight: 550;
    margin: 2px 10px;
    cursor:pointer;
    transition: all .16s ease;
    border: 1px solid transparent;
    border-left: 3px solid transparent;
  }
  .nav-item:hover {
    color:#fff;
    background:rgba(255,255,255,.055);
    transform:translateX(1px);
  }
  .nav-item.active {
    color:#fff;
    background:linear-gradient(90deg, rgba(20,184,166,.20), rgba(20,184,166,.07));
    border-color:rgba(20,184,166,.10);
    border-left-color:var(--accent-bright);
    box-shadow:inset 0 0 20px rgba(20,184,166,.03);
  }
  .nav-item svg { flex-shrink:0; opacity:.78; }
  .nav-item.active svg { opacity:1; color:#FF6A52; }

  /* ---------- Header ---------- */
  header.bg-white {
    background:rgba(255,255,255,.88) !important;
    backdrop-filter:blur(16px);
    border-color:rgba(226,232,240,.9) !important;
    box-shadow:0 1px 0 rgba(15,23,42,.025);
  }
  header .btn-secondary { background:#fff; }

  /* ---------- Cards ---------- */
  .card {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:0 2px 8px rgba(15,23,42,.035);
    overflow:hidden;
    transition:box-shadow .16s ease, border-color .16s ease;
  }
  .card:hover {
    border-color:#dfe5eb;
    box-shadow:0 8px 24px rgba(15,23,42,.055);
  }
  .card h3 {
    color:var(--ink);
    font-family:var(--font-display);
    font-size:15px;
    font-weight:650;
    margin-bottom:.85rem;
  }

  /* ---------- Buttons ---------- */
  .btn-primary {
    background:linear-gradient(135deg, var(--accent), #A71900);
    color:#fff;
    border:1px solid transparent;
    border-radius:9px;
    padding:.58rem 1rem;
    font-size:.82rem;
    font-weight:650;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:.4rem;
    cursor:pointer;
    box-shadow:0 2px 5px rgba(15,118,110,.14);
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .btn-primary:hover {
    background:linear-gradient(135deg, var(--accent-dark), #C01D00);
    transform:translateY(-1px);
    box-shadow:0 5px 12px rgba(15,118,110,.18);
  }
  .btn-primary:active { transform:translateY(0); }
  .btn-secondary {
    background:#fff;
    color:#334155;
    border:1px solid #dfe5ec;
    border-radius:9px;
    padding:.52rem .95rem;
    font-size:.82rem;
    font-weight:550;
    cursor:pointer;
    transition:all .12s ease;
  }
  .btn-secondary:hover {
    border-color:#99d8d0;
    background:var(--accent-soft);
    color:var(--accent-dark);
  }

  /* ---------- Stats ---------- */
  .stat-card {
    position:relative;
    background:linear-gradient(145deg,#fff,#fbfdfd);
    border:1px solid var(--border);
    border-radius:16px;
    padding:1.15rem 1.2rem;
    border-top:0;
    overflow:hidden;
  }
  .stat-card:before {
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:4px;
    background:linear-gradient(180deg,#E13A1F,var(--accent));
  }
  .stat-card .stat-value {
    font-family:var(--font-mono);
    font-size:1.8rem;
    font-weight:650;
    color:var(--ink);
    line-height:1.15;
  }
  .stat-card .stat-label {
    font-size:.74rem;
    color:var(--ink-soft);
    font-weight:600;
    margin-bottom:.45rem;
    text-transform:uppercase;
    letter-spacing:.045em;
  }

  /* ---------- Forms ---------- */
  input,select,textarea {
    outline:none !important;
    font-family:var(--font-body) !important;
    color:#1e293b;
    background:#fff;
    border-color:#dfe5ec !important;
    border-radius:9px !important;
    transition:border-color .12s, box-shadow .12s, background .12s;
  }
  input::placeholder, textarea::placeholder { color:#a3acb9; }
  input:hover,select:hover,textarea:hover { border-color:#cbd5e1 !important; }
  input:focus,select:focus,textarea:focus {
    box-shadow:0 0 0 3px rgba(20,184,166,.11) !important;
    border-color:var(--accent) !important;
    background:#fff;
  }
  label { letter-spacing:.005em; }

  /* ---------- Tables ---------- */
  .card table {
    border-collapse:separate;
    border-spacing:0;
  }
  .card table thead th {
    text-transform:uppercase;
    font-size:10px;
    letter-spacing:.07em;
    color:#94a3b8;
    font-weight:700;
    border-bottom:1px solid var(--border);
    padding:0 10px .65rem;
    white-space:nowrap;
  }
  .card table thead th:first-child,
  .card table tbody td:first-child { padding-left:0; }
  .card table thead th:last-child,
  .card table tbody td:last-child { padding-right:0; }
  .card table tbody tr { border-top:1px solid var(--border); }
  .card table tbody tr:hover { background:#fafdfc; }
  .card table td {
    padding: .72rem 10px;
    color:#475569;
    vertical-align:middle;
    white-space:nowrap;
  }
  .card table td:first-child { color:#1e293b; font-weight:550; }

  /* ---------- Badges ---------- */
  .badge-Full-time { background:#e8f2ff; color:#2563a8; }
  .badge-Part-time { background:#efedff; color:#5b4bc4; }
  .badge-Intern { background:#fff3df; color:#a16207; }
  .badge-Contractor { background:#fcecf4; color:#a21caf; }
  .badge-Pending { background:#fff3df; color:#a16207; }
  .badge-Approved { background:#e6f7ef; color:#087f5b; }
  .badge-Rejected { background:#feecec; color:#b42318; }
  .badge-Active { background:#e6f7ef; color:#087f5b; }
  .badge-Offboarded { background:#eef0f3; color:#64748b; }

  /* ---------- Action links / icon buttons ---------- */
  .icon-btn {
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:30px;
    height:30px;
    border-radius:8px;
    transition:background .12s;
  }
  .icon-btn:hover { background:#f1f5f9; }

  /* ---------- Generic list blocks ---------- */
  .card .border-b { border-color:var(--border) !important; }
  .card .border { border-color:var(--border) !important; }
  .bg-gray-50 { background:#f8fafc !important; }
  .text-gray-400 { color:#94a3b8 !important; }
  .text-gray-500 { color:#64748b !important; }

  /* ---------- Modal ---------- */
  #modalOverlay { backdrop-filter:blur(4px); background:rgba(15,23,42,.52) !important; }
  #modalOverlay > .card {
    box-shadow:0 24px 70px rgba(15,23,42,.25);
    border-radius:18px;
  }

  /* ---------- Toast ---------- */
  #toastRoot > div {
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 10px 30px rgba(15,23,42,.18);
  }

  /* ---------- Loading / errors ---------- */
  #content-slot > .card.text-red-600 {
    border-color:#fecaca;
    background:#fff7f7;
  }

  /* ---------- Scrollbars ---------- */
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:8px; }
  .sidebar::-webkit-scrollbar-thumb { background:#26334d; }

  /* ---------- Responsive polish ---------- */
  @media (max-width: 767px) {
    .sidebar { display:none !important; }
    main { padding-top:1.1rem !important; }
    .card { border-radius:14px; }
    .card table { min-width:650px; }
    .card:has(table) { overflow-x:auto; }
    header .overflow-x-auto { scrollbar-width:none; }
    header .overflow-x-auto::-webkit-scrollbar { display:none; }
  }
  @media (min-width: 768px) {
    .md\:ml-60 { margin-left:248px !important; }
  }

  /* ---------- Grafio Creative Studio brand layer ---------- */
  .brand-red { color: #C01D00; }
  .brand-red-bg { background: #C01D00; }
  .brand-glow { box-shadow: 0 10px 28px rgba(192,29,0,.16); }
  .sidebar .nav-item.active {
    background: linear-gradient(90deg, rgba(192,29,0,.26), rgba(192,29,0,.08));
    border-color: rgba(192,29,0,.14);
    border-left-color: #E13A1F;
    box-shadow: inset 0 0 20px rgba(192,29,0,.04);
  }
  .sidebar .nav-item.active svg { color: #FF6A52; }
  .btn-primary {
    background: linear-gradient(135deg, #C01D00, #A71900) !important;
    border-color: #A71900 !important;
    box-shadow: 0 5px 14px rgba(192,29,0,.16);
  }
  .btn-primary:hover {
    background: linear-gradient(135deg, #A71900, #8F1600) !important;
  }
  input:focus, select:focus, textarea:focus {
    box-shadow: 0 0 0 3px rgba(192,29,0,.11) !important;
    border-color: #C01D00 !important;
  }

</style>
</head>
<body class="text-gray-800">


<div id="app"></div>
<div id="modalRoot"></div>
<div id="toastRoot" class="fixed bottom-4 right-4 z-50 space-y-2"></div>

<script>
const API = '/api';
let state = { token: localStorage.getItem('hrms_token') || null, user: null, employee: null, tab: 'dashboard' };

// ============ CORE HELPERS ============
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(API + path, { ...opts, headers });
  if (res.status === 401) { logout(); throw new Error('Session expired'); }
  const contentType = res.headers.get('content-type') || '';
  const data = contentType.includes('json') ? await res.json() : await res.text();
  if (!res.ok) throw new Error((data && data.error) || 'Request failed');
  return data;
}

function logout() {
  state = { token: null, user: null, employee: null, tab: 'dashboard' };
  localStorage.removeItem('hrms_token');
  render();
}

function badge(text, cls) {
  return `<span class="text-xs px-2 py-1 rounded-full font-medium ${cls || 'bg-gray-100 text-gray-700'}">${text || ''}</span>`;
}

function toast(msg, isError) {
  const el = document.createElement('div');
  el.className = `px-4 py-2.5 rounded-lg shadow-lg text-sm text-white ${isError ? 'bg-red-600' : 'bg-gray-900'}`;
  el.textContent = msg;
  document.getElementById('toastRoot').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function esc(s) { return (s === null || s === undefined) ? '' : String(s).replace(/"/g, '&quot;'); }

// Generic confirm-then-run for delete actions
async function confirmRun(message, fn) {
  if (!confirm(message)) return;
  try {
    await fn();
    toast('Done');
    render();
  } catch (e) {
    toast(e.message, true);
  }
}

// ============ MODAL SYSTEM ============
function openModal(title, bodyHtml) {
  document.getElementById('modalRoot').innerHTML = `
    <div class="fixed inset-0 bg-black/50 flex items-start sm:items-center justify-center z-50 p-4 overflow-y-auto" id="modalOverlay">
      <div class="card p-6 w-full max-w-lg my-8" onclick="event.stopPropagation()">
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-semibold text-lg">${title}</h3>
          <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
        </div>
        ${bodyHtml}
      </div>
    </div>
  `;
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'modalOverlay') closeModal();
  });
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }
window.closeModal = closeModal;

  el.innerHTML = `

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('loginError');
    errEl.classList.add('hidden');
    try {
      const data = await api('/auth/login', { method: 'POST', body: JSON.stringify({ email, password }) });
      state.token = data.token;
      state.user = data.user;
      localStorage.setItem('hrms_token', data.token);
      await loadMe();
      render();
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.remove('hidden');
    }
  });
}

async function loadMe() {
  const data = await api('/auth/me');
  state.user = data.user;
  state.employee = data.employee;
}

// ============ TAB CONFIG BY ROLE ============
function navGroupsForRole(role) {
  const groups = [
    { label: 'Overview', items: [
      { id: 'dashboard', label: 'Dashboard', icon: 'home' },
      { id: 'attendance', label: 'Attendance', icon: 'clock' },
      { id: 'leave', label: 'Leave', icon: 'leaf' },
      { id: 'projects', label: 'Projects', icon: 'folder' },
      { id: 'payslips', label: 'Payslips', icon: 'cash' },
      { id: 'hrdesk', label: 'HR Desk', icon: 'desk' },
    ]}
  ];
  const teamItems = [];
  if (role === 'Manager') {
    teamItems.push({ id: 'team', label: 'Team', icon: 'users' });
    teamItems.push({ id: 'approvals', label: 'Approvals', icon: 'check' });
    teamItems.push({ id: 'performance', label: 'Performance', icon: 'target' });
  }
  if (['HRAdmin', 'SystemAdmin'].includes(role)) {
    teamItems.push({ id: 'employees', label: 'Employees', icon: 'users' });
    teamItems.push({ id: 'recruitment', label: 'Recruitment', icon: 'briefcase' });
    teamItems.push({ id: 'performance', label: 'Performance', icon: 'target' });
    teamItems.push({ id: 'approvals', label: 'Approvals', icon: 'check' });
  }
  if (teamItems.length) groups.push({ label: 'Workforce', items: teamItems });

  const financeItems = [];
  if (['HRAdmin', 'SystemAdmin'].includes(role)) {
    financeItems.push({ id: 'payroll', label: 'Payroll', icon: 'bank' });
    financeItems.push({ id: 'reports', label: 'Reports', icon: 'chart' });
  }
  if (role === 'FinanceOfficer') {
    financeItems.push({ id: 'finance', label: 'Compensation', icon: 'cash' });
    financeItems.push({ id: 'reimbursements', label: 'Reimbursements', icon: 'bank' });
  }
  if (financeItems.length) groups.push({ label: 'Finance', items: financeItems });

  const adminItems = [];
  if (['HRAdmin', 'SystemAdmin'].includes(role)) adminItems.push({ id: 'settings', label: 'Settings', icon: 'gear' });
  if (role === 'SystemAdmin') adminItems.push({ id: 'users', label: 'Users', icon: 'lock' });
  if (adminItems.length) groups.push({ label: 'Administration', items: adminItems });

  return groups;
}

function tabsForRole(role) {
  return navGroupsForRole(role).flatMap(g => g.items);
}

function switchTab(tab) {
  state.tab = tab;
  render();
}
window.switchTab = switchTab;
window.logout = logout;

// ============ DASHBOARD ============
async function dashboardView() {
  const d = await api('/ess/dashboard');
  const empType = state.employee ? state.employee.employment_type : '';
  const firstName = state.employee ? state.employee.full_name.split(' ')[0] : '';
  return `
    <div class="mb-6">
      <h2 class="font-display text-xl font-semibold">Welcome back${firstName ? ', ' + firstName : ''}</h2>
      <p class="text-sm text-gray-500 mt-0.5">Here's what's happening with your work today.</p>
    </div>
    <div class="grid md:grid-cols-3 gap-4 mb-6">
      <div class="stat-card">
        <p class="stat-label">Employment Type</p>
        <p class="stat-value" style="font-size:1.2rem;">${badge(empType, 'badge-' + empType)}</p>
      </div>
      <div class="stat-card">
        <p class="stat-label">Pending Leave Requests</p>
        <p class="stat-value">${d.pending_leave_requests}</p>
      </div>
      <div class="stat-card">
        <p class="stat-label">Active Projects</p>
        <p class="stat-value">${d.projects.length}</p>
      </div>
    </div>
    <div class="grid md:grid-cols-2 gap-4">
      <div class="card p-5">
        <h3>Recent Attendance</h3>
        <table class="w-full text-sm">
          <thead><tr class="text-left text-gray-500"><th class="pb-2">Date</th><th>In</th><th>Out</th><th>Hours</th></tr></thead>
          <tbody>
            ${d.attendance.map(a => `<tr class="border-t"><td class="py-1.5">${a.date}</td><td>${a.check_in || '-'}</td><td>${a.check_out || '-'}</td><td>${a.hours_worked || '-'}</td></tr>`).join('') || '<tr><td class="py-2 text-gray-400" colspan="4">No records yet</td></tr>'}
          </tbody>
        </table>
      </div>
      <div class="card p-5">
        <h3 class="font-semibold mb-3">Leave Balances</h3>
        <div class="space-y-2">
          ${d.leaveBalances.map(b => `
            <div class="flex justify-between items-center border-b pb-2">
              <span class="text-sm">${b.leave_type}</span>
              <span class="font-semibold">${b.balance} days</span>
            </div>`).join('') || '<p class="text-gray-400 text-sm">No leave balance configured (e.g. Contractor)</p>'}
        </div>

        <input name="full_name" placeholder="Full name" value="${esc(e.full_name)}" required class="border rounded-lg px-3 py-2 text-sm col-span-2">

        <input name="phone" placeholder="Phone" value="${esc(e.phone)}" class="border rounded-lg px-3 py-2 text-sm">

        <select name="employment_type" class="border rounded-lg px-3 py-2 text-sm col-span-2">
          ${['Full-time','Part-time','Contractor','Intern'].map(t => `<option value="${t}" ${e.employment_type===t?'selected':''}>${t}</option>`).join('')}
        </select>
        <select name="department_id" class="border rounded-lg px-3 py-2 text-sm">
          <option value="">Department</option>${opt(depts, 'department_id', 'name', e.department_id)}
        </select>
        <select name="designation_id" class="border rounded-lg px-3 py-2 text-sm">
          <option value="">Designation</option>${opt(desigs, 'designation_id', 'title', e.designation_id)}
        </select>
        <select name="location_id" class="border rounded-lg px-3 py-2 text-sm">
          <option value="">Location</option>${opt(locs, 'location_id', 'name', e.location_id)}
        </select>
        <select name="manager_id" class="border rounded-lg px-3 py-2 text-sm">
          <option value="">Manager</option>${allEmployees.filter(x=>x.id!==e.id).map(x=>`<option value="${x.id}" ${x.id===e.manager_id?'selected':''}>${x.full_name}</option>`).join('')}
        </select>
        <input name="address" placeholder="Address" value="${esc(e.address)}" class="border rounded-lg px-3 py-2 text-sm col-span-2">
        <input name="emergency_contact" placeholder="Emergency contact" value="${esc(e.emergency_contact)}" class="border rounded-lg px-3 py-2 text-sm col-span-2">
        <input name="bank_details" placeholder="Bank details" value="${esc(e.bank_details)}" class="border rounded-lg px-3 py-2 text-sm col-span-2">
      </div>
      <details class="border rounded-lg p-2">
        <summary class="text-sm font-medium cursor-pointer">Intern-specific fields</summary>
        <div class="grid grid-cols-2 gap-2 mt-2">
          <input name="internship_start_date" type="date" value="${e.internship_start_date ? e.internship_start_date.slice(0,10) : ''}" class="border rounded-lg px-3 py-2 text-sm" placeholder="Internship start">
          <input name="internship_end_date" type="date" value="${e.internship_end_date ? e.internship_end_date.slice(0,10) : ''}" class="border rounded-lg px-3 py-2 text-sm" placeholder="Internship end">
          <select name="mentor_id" class="border rounded-lg px-3 py-2 text-sm col-span-2">
            <option value="">Mentor</option>${allEmployees.filter(x=>x.id!==e.id).map(x=>`<option value="${x.id}" ${x.id===e.mentor_id?'selected':''}>${x.full_name}</option>`).join('')}
          </select>
          <input name="university" placeholder="University" value="${esc(e.university)}" class="border rounded-lg px-3 py-2 text-sm col-span-2">
          <input name="course_program" placeholder="Course/Program" value="${esc(e.course_program)}" class="border rounded-lg px-3 py-2 text-sm">
          <input name="institution_supervisor" placeholder="Institution supervisor" value="${esc(e.institution_supervisor)}" class="border rounded-lg px-3 py-2 text-sm">
        </div>
      </details>
      <details class="border rounded-lg p-2">
        <summary class="text-sm font-medium cursor-pointer">Contractor-specific fields</summary>
        <div class="grid grid-cols-2 gap-2 mt-2">
          <input name="contract_start_date" type="date" value="${e.contract_start_date ? e.contract_start_date.slice(0,10) : ''}" class="border rounded-lg px-3 py-2 text-sm">

      if (isEdit) {

      } else {
        await api('/employees', { method: 'POST', body: JSON.stringify(fd) });

      render();

  function lookupSection(title, table, items, nameField) {
    return `

              <span>${i[nameField]}</span>
              <span class="flex gap-2">
                <button onclick="editLookup('${table}', ${i.id}, '${nameField}', '${esc(i[nameField])}')" class="text-xs text-blue-600 hover:underline">Edit</button>
                <button onclick="deleteLookup('${table}', ${i.id})" class="text-xs text-red-600 hover:underline">Delete</button>

  }

  return `
    <div class="grid md:grid-cols-2 gap-4 mb-4">
      ${lookupSection('Departments', 'departments', depts, 'name')}
      ${lookupSection('Designations', 'designations', desigs, 'title')}
      ${lookupSection('Locations', 'locations', locs, 'name')}
      ${lookupSection('Skills', 'skills', skills, 'name')}
    </div>

    <div class="card p-5 mb-4">
      <h3 class="font-semibold mb-3">Leave Policies</h3>
      <form id="policyCreateForm" class="grid sm:grid-cols-6 gap-2 mb-3">
        <input name="name" placeholder="Policy name" required class="border rounded-lg px-3 py-2 text-sm sm:col-span-2">
        <select name="applies_to" class="border rounded-lg px-3 py-2 text-sm">
          <option value="Standard">Standard</option>
          <option value="Intern">Intern</option>
        </select>
        <input name="annual_days" type="number" placeholder="Annual" class="border rounded-lg px-3 py-2 text-sm">
        <input name="sick_days" type="number" placeholder="Sick" class="border rounded-lg px-3 py-2 text-sm">
        <input name="casual_days" type="number" placeholder="Casual" class="border rounded-lg px-3 py-2 text-sm">
        <button class="sm:col-span-6 btn-primary py-2">Add Policy</button>
      </form>
      <table class="w-full text-sm">
        <thead><tr class="text-left text-gray-500"><th class="pb-2">Name</th><th>Applies To</th><th>Annual</th><th>Sick</th><th>Casual</th><th></th></tr></thead>
        <tbody>
          ${policies.map(p => `
            <tr class="border-t">
              <td class="py-1.5">${p.name}</td><td>${p.applies_to}</td><td>${p.annual_days}</td><td>${p.sick_days}</td><td>${p.casual_days}</td>
              <td>
                <button onclick="editLeavePolicy(${p.id}, ${p.annual_days}, ${p.sick_days}, ${p.casual_days})" class="text-xs text-blue-600 hover:underline">Edit</button>
                <button onclick="deleteLeavePolicy(${p.id})" class="text-xs text-red-600 hover:underline ml-2">Delete</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>

    ${isSystemAdmin ? `
    <div class="card p-5">
      <h3 class="font-semibold mb-3">Audit Log (latest 50)</h3>
      <div id="auditLogBox" class="text-xs space-y-1 max-h-96 overflow-y-auto">Loading...</div>
    </div>` : ''}
  `;
}

async function loadAuditLog() {
  const box = document.getElementById('auditLogBox');
  if (!box) return;
  try {
    const audit = await api('/admin/audit-logs');
    box.innerHTML = audit.slice(0, 50).map(a => `<div class="border-b py-1"><b>${a.action}</b> by ${a.user_email || 'system'} <span class="text-gray-400">— ${new Date(a.created_at).toLocaleString()}</span></div>`).join('') || '<p class="text-gray-400">No activity yet</p>';
  } catch (e) { box.innerHTML = `<p class="text-red-600">${e.message}</p>`; }
}

async function addLookup(ev, table, nameField) {
  ev.preventDefault();
  const fd = Object.fromEntries(new FormData(ev.target));
  try {
    await api(`/admin/${table}`, { method: 'POST', body: JSON.stringify(fd) });
    toast('Added');
    render();
  } catch (e) { toast(e.message, true); }
}
function editLookup(table, id, nameField, current) {
  const val = prompt('Edit value:', current);
  if (val === null || val === current) return;
  confirmRun('Save change?', () => api(`/admin/${table}/${id}`, { method: 'PUT', body: JSON.stringify({ [nameField]: val }) }));
}
function deleteLookup(table, id) {
  confirmRun('Delete this entry? Employees using it will just have it unset, not be deleted.', () => api(`/admin/${table}/${id}`, { method: 'DELETE' }));
}
function editLeavePolicy(id, annual, sick, casual) {
  const a = prompt('Annual days:', annual); if (a === null) return;
  const s = prompt('Sick days:', sick); if (s === null) return;
  const c = prompt('Casual days:', casual); if (c === null) return;
  confirmRun('Save policy changes?', () => api(`/leave/policies/${id}`, {
    method: 'PUT', body: JSON.stringify({ annual_days: parseFloat(a), sick_days: parseFloat(s), casual_days: parseFloat(c) })
  }));
}
function deleteLeavePolicy(id) {
  confirmRun('Delete this leave policy?', () => api(`/leave/policies/${id}`, { method: 'DELETE' }));
}
window.addLookup = addLookup;
window.editLookup = editLookup;
window.deleteLookup = deleteLookup;
window.editLeavePolicy = editLeavePolicy;
window.deleteLeavePolicy = deleteLeavePolicy;

function attachSettingsForms() {

      render();
    } catch (err) { toast(err.message, true); }
  });
  loadAuditLog();
}

// ============ ROUTER ============
async function renderContent() {
  const contentEl = document.getElementById('content-slot');
  if (!contentEl) return;
  contentEl.innerHTML = '<div class="text-center py-12 text-gray-400">Loading...</div>';
  let html = '';
  try {
    switch (state.tab) {
      case 'dashboard': html = await dashboardView(); break;
      case 'attendance': html = await attendanceView(); break;
      case 'leave': html = await leaveView(); break;
      case 'projects': html = await projectsView(); break;
      case 'payslips': html = await payslipsView(); break;
      case 'hrdesk': html = await hrdeskView(); break;
      case 'team': html = await teamView(); break;
      case 'approvals': html = await approvalsView(); break;
      case 'employees': html = await employeesView(); break;
      case 'recruitment': html = await recruitmentView(); break;
      case 'performance': html = await performanceView(); break;
      case 'payroll': html = await payrollView(); break;
      case 'reports': html = await reportsView(); break;
      case 'settings': html = await settingsView(); break;
      case 'finance': html = await financeView(); break;
      case 'reimbursements': html = await reimbursementsView(); break;
      case 'users': html = await usersView(); break;
      default: html = '<p>Not found</p>';
    }
  } catch (e) {
    html = `<div class="card p-6 text-red-600">Error: ${e.message}</div>`;
  }
  contentEl.innerHTML = html;
  attachCorrectionForm();
  attachLeaveForm();
  attachTimeLogForm();
  attachReimbForm();
  attachProjForm();
  attachTicketForm();
  attachAnnForm();
  attachPolicyForm();
  attachPayrollRunForm();
  attachReqForm();
  attachPerformanceForms();
  attachSettingsForms();
  attachUserForm();
}

async function render() {
  const el = document.getElementById('app');
  if (!state.token) { loginScreen(); return; }
  if (!state.user) {
    try { await loadMe(); } catch (e) { loginScreen(); return; }
  }
  el.innerHTML = shell('<div id="content-slot"></div>');
  await renderContent();
}

render();
</script>
