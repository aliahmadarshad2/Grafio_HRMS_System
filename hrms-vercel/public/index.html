<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grafio HRMS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Grafio brand palette — derived from the supplied logo */
    --bg: #f7f4f2;
    --surface: #fffdfb;
    --surface-soft: #fbf8f6;
    --ink: #1d1917;
    --ink-soft: #746b66;
    --ink-faint: #a49b95;
    --border: #e9e1dc;
    --sidebar: #171311;
    --sidebar-2: #241c19;
    --sidebar-text: #aaa09a;
    --sidebar-text-active: #ffffff;
    --accent: #c01c00;
    --accent-dark: #9f1700;
    --accent-bright: #e33518;
    --accent-soft: #fff0ec;
    --accent-muted: #f8d8d1;
    --danger: #b42318;
    --warning: #b45309;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    font-family: var(--font-body);
    background:
      radial-gradient(circle at 85% 0%, rgba(192,28,0,.055), transparent 26rem),
      var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,h4,.font-display {
    font-family: var(--font-display);
    letter-spacing: -.025em;
  }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* ---------- App shell ---------- */
  .sidebar {
    width: 248px !important;
    background: linear-gradient(180deg, var(--sidebar) 0%, #0b1222 100%);
    border-right: 1px solid rgba(255,255,255,.05);
    box-shadow: 8px 0 30px rgba(15,23,42,.05);
  }
  .nav-group-label {
    color: #64748b;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: 0 14px;
    margin-top: 22px;
    margin-bottom: 7px;
  }
  .nav-item {
    display:flex;
    align-items:center;
    gap:11px;
    min-height:40px;
    padding: 9px 13px;
    border-radius: 10px;
    color: var(--sidebar-text);
    font-size: 13px;
    font-weight: 550;
    margin: 2px 10px;
    cursor:pointer;
    transition: all .16s ease;
    border: 1px solid transparent;
    border-left: 3px solid transparent;
  }
  .nav-item:hover {
    color:#fff;
    background:rgba(255,255,255,.055);
    transform:translateX(1px);
  }
  .nav-item.active {
    color:#fff;
    background:linear-gradient(90deg, rgba(192,28,0,.25), rgba(192,28,0,.08));
    border-color:rgba(192,28,0,.14);
    border-left-color:var(--accent-bright);
    box-shadow:inset 0 0 20px rgba(192,28,0,.04);
  }
  .nav-item svg { flex-shrink:0; opacity:.78; }
  .nav-item.active svg { opacity:1; color:#ff6a50; }

  /* ---------- Header ---------- */
  header.bg-white {
    background:rgba(255,255,255,.88) !important;
    backdrop-filter:blur(16px);
    border-color:rgba(226,232,240,.9) !important;
    box-shadow:0 1px 0 rgba(15,23,42,.025);
  }
  header .btn-secondary { background:#fff; }

  /* ---------- Cards ---------- */
  .card {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:0 2px 8px rgba(15,23,42,.035);
    overflow:hidden;
    transition:box-shadow .16s ease, border-color .16s ease;
  }
  .card:hover {
    border-color:#dfe5eb;
    box-shadow:0 8px 24px rgba(15,23,42,.055);
  }
  .card h3 {
    color:var(--ink);
    font-family:var(--font-display);
    font-size:15px;
    font-weight:650;
    margin-bottom:.85rem;
  }

  /* ---------- Buttons ---------- */
  .btn-primary {
    background:linear-gradient(135deg, var(--accent), #d92c0f);
    color:#fff;
    border:1px solid transparent;
    border-radius:9px;
    padding:.58rem 1rem;
    font-size:.82rem;
    font-weight:650;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:.4rem;
    cursor:pointer;
    box-shadow:0 2px 5px rgba(192,28,0,.16);
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .btn-primary:hover {
    background:linear-gradient(135deg, var(--accent-dark), var(--accent));
    transform:translateY(-1px);
    box-shadow:0 5px 12px rgba(192,28,0,.20);
  }
  .btn-primary:active { transform:translateY(0); }
  .btn-secondary {
    background:#fff;
    color:#334155;
    border:1px solid #dfe5ec;
    border-radius:9px;
    padding:.52rem .95rem;
    font-size:.82rem;
    font-weight:550;
    cursor:pointer;
    transition:all .12s ease;
  }
  .btn-secondary:hover {
    border-color:#e9b7ae;
    background:var(--accent-soft);
    color:var(--accent-dark);
  }

  /* ---------- Stats ---------- */
  .stat-card {
    position:relative;
    background:linear-gradient(145deg,#fffdfb,#fbf7f5);
    border:1px solid var(--border);
    border-radius:16px;
    padding:1.15rem 1.2rem;
    border-top:0;
    overflow:hidden;
  }
  .stat-card:before {
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width:4px;
    background:linear-gradient(180deg,#ed6249,var(--accent));
  }
  .stat-card .stat-value {
    font-family:var(--font-mono);
    font-size:1.8rem;
    font-weight:650;
    color:var(--ink);
    line-height:1.15;
  }
  .stat-card .stat-label {
    font-size:.74rem;
    color:var(--ink-soft);
    font-weight:600;
    margin-bottom:.45rem;
    text-transform:uppercase;
    letter-spacing:.045em;
  }

  /* ---------- Forms ---------- */
  input,select,textarea {
    outline:none !important;
    font-family:var(--font-body) !important;
    color:#1e293b;
    background:#fff;
    border-color:#dfe5ec !important;
    border-radius:9px !important;
    transition:border-color .12s, box-shadow .12s, background .12s;
  }
  input::placeholder, textarea::placeholder { color:#a3acb9; }
  input:hover,select:hover,textarea:hover { border-color:#cbd5e1 !important; }
  input:focus,select:focus,textarea:focus {
    box-shadow:0 0 0 3px rgba(192,28,0,.12) !important;
    border-color:var(--accent) !important;
    background:#fff;
  }
  label { letter-spacing:.005em; }

  /* ---------- Tables ---------- */
  .card table {
    border-collapse:separate;
    border-spacing:0;
  }
  .card table thead th {
    text-transform:uppercase;
    font-size:10px;
    letter-spacing:.07em;
    color:#94a3b8;
    font-weight:700;
    border-bottom:1px solid var(--border);
    padding:0 10px .65rem;
    white-space:nowrap;
  }
  .card table thead th:first-child,
  .card table tbody td:first-child { padding-left:0; }
  .card table thead th:last-child,
  .card table tbody td:last-child { padding-right:0; }
  .card table tbody tr { border-top:1px solid var(--border); }
  .card table tbody tr:hover { background:#fff9f7; }
  .card table td {
    padding: .72rem 10px;
    color:#475569;
    vertical-align:middle;
    white-space:nowrap;
  }
  .card table td:first-child { color:#1e293b; font-weight:550; }

  /* ---------- Badges ---------- */
  .badge-Full-time { background:#e8f2ff; color:#2563a8; }
  .badge-Part-time { background:#efedff; color:#5b4bc4; }
  .badge-Intern { background:#fff3df; color:#a16207; }
  .badge-Contractor { background:#fcecf4; color:#a21caf; }
  .badge-Pending { background:#fff3df; color:#a16207; }
  .badge-Approved { background:#e6f7ef; color:#087f5b; }
  .badge-Rejected { background:#feecec; color:#b42318; }
  .badge-Active { background:#e6f7ef; color:#087f5b; }
  .badge-Offboarded { background:#eef0f3; color:#64748b; }

  /* ---------- Action links / icon buttons ---------- */
  .icon-btn {
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:30px;
    height:30px;
    border-radius:8px;
    transition:background .12s;
  }
  .icon-btn:hover { background:#f1f5f9; }

  /* ---------- Generic list blocks ---------- */
  .card .border-b { border-color:var(--border) !important; }
  .card .border { border-color:var(--border) !important; }
  .bg-gray-50 { background:#f8fafc !important; }
  .text-gray-400 { color:#94a3b8 !important; }
  .text-gray-500 { color:#64748b !important; }

  /* ---------- Notifications ---------- */
  .notification-wrap { position:relative; }
  .notification-panel {
    position:absolute;
    top:calc(100% + 10px);
    right:0;
    width:min(390px, calc(100vw - 24px));
    background:rgba(255,253,251,.98);
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:0 22px 60px rgba(48,26,20,.16);
    transform-origin:top right;
    z-index:80;
  }
  .notification-panel.hidden { display:none; }
  .notification-header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#fffdfb,#fbf7f5);
  }
  .notification-list { max-height:390px; overflow-y:auto; padding:6px; }
  .notification-item {
    display:flex;
    gap:11px;
    width:100%;
    padding:11px 10px;
    border-radius:12px;
    text-align:left;
    border:1px solid transparent;
    transition:background .14s ease,border-color .14s ease;
  }
  .notification-item:hover { background:var(--accent-soft); border-color:#f3d2cb; }
  .notification-item.unread { background:#fff7f4; }
  .notification-icon {
    width:34px; height:34px; flex:0 0 34px;
    display:flex; align-items:center; justify-content:center;
    border-radius:10px;
    background:var(--accent-soft);
    color:var(--accent);
    border:1px solid #f2d1c9;
  }
  .notification-item.read .notification-icon {
    background:#f5f2f0; color:#8e847e; border-color:#ebe4df;
  }
  .notification-dot {
    width:7px; height:7px; border-radius:50%;
    background:var(--accent);
    margin-top:6px; flex:0 0 7px;
    box-shadow:0 0 0 3px rgba(192,28,0,.10);
  }
  .notification-empty { padding:30px 18px; text-align:center; color:#918780; }
  .notif-badge {
    position:absolute; top:-4px; right:-4px;
    min-width:18px; height:18px; padding:0 4px;
    border-radius:999px; background:var(--accent); color:#fff;
    border:2px solid #fffdfb;
    font-size:9px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
    line-height:1;
  }
  .notif-bell-btn {
    width:36px; height:36px; border-radius:11px;
    border:1px solid var(--border); background:#fffdfb; color:#665c57;
    display:inline-flex; align-items:center; justify-content:center;
    position:relative; cursor:pointer;
    transition:all .14s ease;
  }
  .notif-bell-btn:hover { color:var(--accent); border-color:#edc5bd; background:var(--accent-soft); }
  .notif-bell-btn.has-unread { color:var(--accent); }
  .notification-time { font-size:10px; color:#a19892; margin-top:3px; }
  @media (max-width: 480px) {
    .notification-panel { position:fixed; top:68px; right:12px; left:12px; width:auto; }
  }

  /* ---------- Modal ---------- */
  #modalOverlay { backdrop-filter:blur(4px); background:rgba(15,23,42,.52) !important; }
  #modalOverlay > .card {
    box-shadow:0 24px 70px rgba(15,23,42,.25);
    border-radius:18px;
  }

  /* ---------- Toast ---------- */
  #toastRoot > div {
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 10px 30px rgba(15,23,42,.18);
  }

  /* ---------- Loading / errors ---------- */
  #content-slot > .card.text-red-600 {
    border-color:#fecaca;
    background:#fff7f7;
  }

  /* ---------- Scrollbars ---------- */
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:8px; }
  .sidebar::-webkit-scrollbar-thumb { background:#26334d; }

  /* ---------- Responsive polish ---------- */
  @media (max-width: 767px) {
    .sidebar { display:none !important; }
    main { padding-top:1.1rem !important; }
    .card { border-radius:14px; }
    .card table { min-width:650px; }
    .card:has(table) { overflow-x:auto; }
    header .overflow-x-auto { scrollbar-width:none; }
    header .overflow-x-auto::-webkit-scrollbar { display:none; }
  }
  @media (min-width: 768px) {
    .md\:ml-60 { margin-left:248px !important; }
  }

  .field-label { display:block; font-size:.72rem; font-weight:600; color:#6b7280; margin-bottom:.35rem; }
  .task-row { transition: background .15s ease; }

</style>
</head>

let state = { token: localStorage.getItem('hrms_token') || null, user: null, employee: null, tab: 'dashboard' };
let notifPollHandle = null;
let notifCache = [];

// ============ CORE HELPERS ============
async function api(path, opts = {}) {
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(API + path, { ...opts, headers });
  if (res.status === 401) { logout(); throw new Error('Session expired'); }
  const contentType = res.headers.get('content-type') || '';
  const data = contentType.includes('json') ? await res.json() : await res.text();
  if (!res.ok) throw new Error((data && data.error) || 'Request failed');
  return data;
}

function logout() {
  if (notifPollHandle) {
    clearInterval(notifPollHandle);
    notifPollHandle = null;
  }
  notifCache = [];
  state = { token: null, user: null, employee: null, tab: 'dashboard' };
  localStorage.removeItem('hrms_token');
  render();
}

function badge(text, cls) {
  return `<span class="text-xs px-2 py-1 rounded-full font-medium ${cls || 'bg-gray-100 text-gray-700'}">${text || ''}</span>`;
}

function toast(msg, isError) {
  const el = document.createElement('div');
  el.className = `px-4 py-2.5 rounded-lg shadow-lg text-sm text-white ${isError ? 'bg-red-600' : 'bg-gray-900'}`;
  el.textContent = msg;
  document.getElementById('toastRoot').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

// Generic confirm-then-run for delete actions
async function confirmRun(message, fn) {
  if (!confirm(message)) return;
  try {
    await fn();

// ============ NOTIFICATIONS ============
function notificationIconName(n) {
  const text = `${n.title || ''} ${n.message || ''}`.toLowerCase();
  if (/leave|vacation|absence/.test(text)) return 'leaf';
  if (/attendance|check.?in|check.?out|late/.test(text)) return 'clock';
  if (/payroll|salary|payslip|payment|reimburse|compensation/.test(text)) return 'cash';
  if (/task|deadline|project/.test(text)) return 'tasks';
  if (/approval|approved|rejected|request/.test(text)) return 'check';
  if (/employee|user|recruit|hire/.test(text)) return 'users';
  if (/warning|failed|error|urgent/.test(text)) return 'alert';
  return 'bell';
}

function notificationLabel(n) {
  const text = `${n.title || ''} ${n.message || ''}`.toLowerCase();
  if (/leave/.test(text)) return 'Leave';
  if (/attendance|check.?in|check.?out/.test(text)) return 'Attendance';
  if (/payroll|salary|payslip|payment|reimburse|compensation/.test(text)) return 'Finance';
  if (/task|project|deadline/.test(text)) return 'Work';
  if (/approval|approved|rejected|request/.test(text)) return 'Approval';
  if (/employee|user|recruit|hire/.test(text)) return 'People';
  return 'Grafio';
}

function renderNotificationPanel(notifs) {
  const dropdown = document.getElementById('notifDropdown');
  if (!dropdown) return;
  const unread = notifs.filter(n => !n.is_read).length;
  dropdown.innerHTML = `
    <div class="notification-header">
      <div>
        <div class="font-display font-semibold text-sm text-slate-900">Notifications</div>
        <div class="text-[10px] text-slate-400 mt-0.5">${unread ? `${unread} unread` : 'All caught up'}</div>
      </div>
      ${unread ? `<button onclick="markAllNotificationsRead(event)" class="text-[11px] font-semibold text-[var(--accent)] hover:underline">Mark all read</button>` : ''}
    </div>
    <div class="notification-list">
      ${notifs.map(n => `
        <button type="button" onclick="markNotifRead(${n.id})" class="notification-item ${n.is_read ? 'read' : 'unread'}">
          <span class="notification-icon">${icon(notificationIconName(n))}</span>
          <span class="min-w-0 flex-1">
            <span class="flex items-start gap-2">
              <span class="min-w-0 flex-1">
                <span class="block text-xs font-semibold ${n.is_read ? 'text-slate-500' : 'text-slate-800'}">${esc(n.title || notificationLabel(n))}</span>
                <span class="block text-xs leading-relaxed ${n.is_read ? 'text-slate-400' : 'text-slate-600'} mt-0.5">${esc(n.message || '')}</span>
              </span>
              ${!n.is_read ? '<span class="notification-dot"></span>' : ''}
            </span>
            <span class="notification-time">${n.created_at ? new Date(n.created_at).toLocaleString() : ''}</span>
          </span>
        </button>
      `).join('') || '<div class="notification-empty"><div class="mx-auto mb-2 w-9 h-9 rounded-full bg-[var(--accent-soft)] text-[var(--accent)] flex items-center justify-center">' + icon('bell') + '</div><div class="text-xs font-semibold text-slate-600">No notifications yet</div><div class="text-[11px] mt-1">New HR activity will appear here.</div></div>'}
    </div>
  `;
}

async function refreshNotifBadge() {
  if (!state.token) return;
  try {
    const notifs = await api('/ess/notifications');
    notifCache = Array.isArray(notifs) ? notifs : [];
    const unread = notifCache.filter(n => !n.is_read).length;
    const badge = document.getElementById('notifBadge');
    const btn = document.getElementById('notifBellBtn');
    if (!badge || !btn) return;
    badge.textContent = unread > 9 ? '9+' : unread;
    badge.classList.toggle('hidden', unread === 0);
    btn.classList.toggle('has-unread', unread > 0);
    if (!document.getElementById('notifDropdown')?.classList.contains('hidden')) {
      renderNotificationPanel(notifCache);
    }
  } catch (e) { /* notification polling is non-blocking */ }
}

async function toggleNotifications() {
  const dropdown = document.getElementById('notifDropdown');
  const bell = document.getElementById('notifBellBtn');
  if (!dropdown) return;
  if (!dropdown.classList.contains('hidden')) {
    dropdown.classList.add('hidden');
    if (bell) bell.setAttribute('aria-expanded', 'false');
    return;
  }
  try {
    const notifs = await api('/ess/notifications');
    notifCache = Array.isArray(notifs) ? notifs : [];
    renderNotificationPanel(notifCache);
    dropdown.classList.remove('hidden');
    if (bell) bell.setAttribute('aria-expanded', 'true');
    refreshNotifBadge();
  } catch (e) {
    dropdown.innerHTML = '<div class="notification-empty">Could not load notifications.</div>';
    dropdown.classList.remove('hidden');
  }
}

async function markNotifRead(id) {
  try {
    await api(`/ess/notifications/${id}/read`, { method: 'PUT' });
    const n = notifCache.find(x => x.id === id);
    if (n) n.is_read = true;
    renderNotificationPanel(notifCache);
    refreshNotifBadge();
  } catch (e) {
    toast(e.message, true);
  }
}

async function markAllNotificationsRead(event) {
  if (event) event.stopPropagation();
  const unread = notifCache.filter(n => !n.is_read);
  if (!unread.length) return;
  try {
    await Promise.all(unread.map(n => api(`/ess/notifications/${n.id}/read`, { method: 'PUT' })));
    notifCache.forEach(n => n.is_read = true);
    renderNotificationPanel(notifCache);
    refreshNotifBadge();
  } catch (e) {
    toast(e.message, true);
  }
}

function startNotificationPolling() {
  if (!state.token) return;
  if (notifPollHandle) clearInterval(notifPollHandle);
  refreshNotifBadge();
  notifPollHandle = setInterval(refreshNotifBadge, 30000);
}

document.addEventListener('click', (event) => {
  const wrap = document.querySelector('.notification-wrap');
  const dropdown = document.getElementById('notifDropdown');
  if (wrap && dropdown && !wrap.contains(event.target)) {
    dropdown.classList.add('hidden');
    const bell = document.getElementById('notifBellBtn');
    if (bell) bell.setAttribute('aria-expanded', 'false');
  }
});

window.toggleNotifications = toggleNotifications;
window.markNotifRead = markNotifRead;
window.markAllNotificationsRead = markAllNotificationsRead;

    teamItems.push({ id: 'performance', label: 'Performance', icon: 'target' });

  const financeItems = [];

    financeItems.push({ id: 'payroll', label: 'Payroll', icon: 'bank' });
    financeItems.push({ id: 'reports', label: 'Reports', icon: 'chart' });

    financeItems.push({ id: 'finance', label: 'Compensation', icon: 'cash' });
    financeItems.push({ id: 'reimbursements', label: 'Reimbursements', icon: 'bank' });
  }
  if (financeItems.length) groups.push({ label: 'Finance', items: financeItems });

  const adminItems = [];
  if (['HRAdmin', 'SystemAdmin'].includes(role)) adminItems.push({ id: 'settings', label: 'Settings', icon: 'gear' });

function taskStatusBadge(status) {
  const map = {
    Pending: 'bg-amber-50 text-amber-700 border border-amber-100',
    InProgress: 'bg-blue-50 text-blue-700 border border-blue-100',
    Completed: 'bg-green-50 text-green-700 border border-green-100'
  };
  return badge(status === 'InProgress' ? 'In Progress' : status, map[status] || 'bg-gray-100 text-gray-700');
}

function taskDueLabel(date) {
  if (!date) return '<span class="text-gray-400">No due date</span>';
  const d = new Date(date + 'T00:00:00');
  if (Number.isNaN(d.getTime())) return esc(date);
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((d - today) / 86400000);
  const label = d.toLocaleDateString(undefined, { day: '2-digit', month: 'short', year: 'numeric' });
  if (diff < 0) return `<span class="text-red-600 font-medium">Overdue · ${label}</span>`;
  if (diff === 0) return `<span class="text-red-600 font-medium">Due today</span>`;
  if (diff === 1) return `<span class="text-amber-600 font-medium">Due tomorrow</span>`;
  return `<span class="text-gray-500">Due ${label}</span>`;
}

  openModal(isEdit ? `Edit ${e.full_name}` : 'Add Employee', `

      <div class="grid grid-cols-2 gap-2">
        <input name="full_name" placeholder="Full name" value="${esc(e.full_name)}" required class="border rounded-lg px-3 py-2 text-sm col-span-2">

        <input name="phone" placeholder="Phone" value="${esc(e.phone)}" class="border rounded-lg px-3 py-2 text-sm">
        <input name="hire_date" type="date" value="${e.hire_date ? e.hire_date.slice(0,10) : ''}" class="border rounded-lg px-3 py-2 text-sm">
        <select name="employment_type" class="border rounded-lg px-3 py-2 text-sm col-span-2">
          ${['Full-time','Part-time','Contractor','Intern'].map(t => `<option value="${t}" ${e.employment_type===t?'selected':''}>${t}</option>`).join('')}
        </select>
        <select name="department_id" class="border rounded-lg px-3 py-2 text-sm">
          <option value="">Department</option>${opt(depts, 'department_id', 'name', e.department_id)}
        </select>
        <select name="designation_id" class="border rounded-lg px-3 py-2 text-sm">
          <option value="">Designation</option>${opt(desigs, 'designation_id', 'title', e.designation_id)}
        </select>
        <select name="location_id" class="border rounded-lg px-3 py-2 text-sm">
          <option value="">Location</option>${opt(locs, 'location_id', 'name', e.location_id)}
        </select>
        <select name="manager_id" class="border rounded-lg px-3 py-2 text-sm">
          <option value="">Manager</option>${allEmployees.filter(x=>x.id!==e.id).map(x=>`<option value="${x.id}" ${x.id===e.manager_id?'selected':''}>${x.full_name}</option>`).join('')}
        </select>
        <input name="address" placeholder="Address" value="${esc(e.address)}" class="border rounded-lg px-3 py-2 text-sm col-span-2">
        <input name="emergency_contact" placeholder="Emergency contact" value="${esc(e.emergency_contact)}" class="border rounded-lg px-3 py-2 text-sm col-span-2">
        <input name="bank_details" placeholder="Bank details" value="${esc(e.bank_details)}" class="border rounded-lg px-3 py-2 text-sm col-span-2">
      </div>
      <details class="border rounded-lg p-2">
        <summary class="text-sm font-medium cursor-pointer">Intern-specific fields</summary>
        <div class="grid grid-cols-2 gap-2 mt-2">
          <input name="internship_start_date" type="date" value="${e.internship_start_date ? e.internship_start_date.slice(0,10) : ''}" class="border rounded-lg px-3 py-2 text-sm" placeholder="Internship start">
          <input name="internship_end_date" type="date" value="${e.internship_end_date ? e.internship_end_date.slice(0,10) : ''}" class="border rounded-lg px-3 py-2 text-sm" placeholder="Internship end">
          <select name="mentor_id" class="border rounded-lg px-3 py-2 text-sm col-span-2">
            <option value="">Mentor</option>${allEmployees.filter(x=>x.id!==e.id).map(x=>`<option value="${x.id}" ${x.id===e.mentor_id?'selected':''}>${x.full_name}</option>`).join('')}
          </select>
          <input name="university" placeholder="University" value="${esc(e.university)}" class="border rounded-lg px-3 py-2 text-sm col-span-2">
          <input name="course_program" placeholder="Course/Program" value="${esc(e.course_program)}" class="border rounded-lg px-3 py-2 text-sm">
          <input name="institution_supervisor" placeholder="Institution supervisor" value="${esc(e.institution_supervisor)}" class="border rounded-lg px-3 py-2 text-sm">
        </div>
      </details>
      <details class="border rounded-lg p-2">
        <summary class="text-sm font-medium cursor-pointer">Contractor-specific fields</summary>
        <div class="grid grid-cols-2 gap-2 mt-2">
          <input name="contract_start_date" type="date" value="${e.contract_start_date ? e.contract_start_date.slice(0,10) : ''}" class="border rounded-lg px-3 py-2 text-sm">
          <input name="contract_end_date" type="date" value="${e.contract_end_date ? e.contract_end_date.slice(0,10) : ''}" class="border rounded-lg px-3 py-2 text-sm">

    ev.preventDefault();

    try {
      if (isEdit) {
        await api(`/employees/${e.id}`, { method: 'PUT', body: JSON.stringify(fd) });
      } else {
        await api('/employees', { method: 'POST', body: JSON.stringify(fd) });
      }
      closeModal();
      toast(isEdit ? 'Employee updated' : 'Employee created');
      render();
    } catch (err) { toast(err.message, true); }
  });

  const requisitions = await api('/recruitment/requisitions');
  const depts = await api('/admin/departments');
  const withCandidates = await Promise.all(requisitions.map(async r => ({
    ...r, candidates: await api(`/recruitment/requisitions/${r.id}/candidates`)
  })));
  return `
    <div class="card p-5 mb-4">
      <h3 class="font-semibold mb-3">New Job Requisition</h3>
      <form id="reqForm" class="grid sm:grid-cols-4 gap-2">
        <input name="title" placeholder="Job title" required class="border rounded-lg px-3 py-2 text-sm sm:col-span-2">
        <select name="department_id" class="border rounded-lg px-3 py-2 text-sm">
          <option value="">Department</option>
          ${depts.map(d => `<option value="${d.id}">${d.name}</option>`).join('')}
        </select>
        <button class="btn-primary py-2">Create</button>
        <input name="description" placeholder="Description" class="border rounded-lg px-3 py-2 text-sm sm:col-span-4">
      </form>
    </div>
    <div class="space-y-4">
      ${withCandidates.map(r => `
        <div class="card p-5">
          <div class="flex justify-between items-start mb-2">
            <div>
              <h4 class="font-semibold">${r.title} ${badge(r.status, r.status==='Open'?'badge-Approved':'badge-Offboarded')}</h4>
              <p class="text-xs text-gray-500">${r.department_name || 'No department'}</p>
            </div>
            <div class="flex gap-2">
              <select onchange="updateRequisitionStatus(${r.id}, this.value)" class="text-xs border rounded-lg px-2 py-1">
                <option value="">Change status</option>
                <option value="Open" ${r.status==='Open'?'selected':''}>Open</option>
                <option value="On-hold" ${r.status==='On-hold'?'selected':''}>On-hold</option>
                <option value="Closed" ${r.status==='Closed'?'selected':''}>Closed</option>
              </select>
              <button onclick="deleteRequisition(${r.id})" class="text-xs text-red-600 hover:underline">Delete</button>
            </div>
          </div>
          <form onsubmit="addCandidate(event, ${r.id})" class="flex gap-2 mb-3">
            <input name="full_name" placeholder="Candidate name" required class="border rounded-lg px-2 py-1 text-xs flex-1">
            <input name="email" placeholder="Email" class="border rounded-lg px-2 py-1 text-xs flex-1">
            <button class="btn-primary text-xs px-3 py-1">Add</button>
          </form>
          <table class="w-full text-xs">
            <thead><tr class="text-left text-gray-500"><th class="pb-1">Name</th><th>Stage</th><th></th></tr></thead>
            <tbody>
              ${r.candidates.map(c => `
                <tr class="border-t">
                  <td class="py-1">${c.full_name}</td>
                  <td>
                    <select onchange="updateCandidateStage(${c.id}, this.value)" class="border rounded px-1 py-0.5">
                      ${['Applied','Screened','Interviewed','Offered','Hired','Rejected'].map(s => `<option value="${s}" ${c.stage===s?'selected':''}>${s}</option>`).join('')}
                    </select>
                  </td>
                  <td>
                    ${c.stage === 'Offered' ? `<button onclick="hireCandidate(${c.id})" class="text-green-600 hover:underline mr-2">Hire</button>` : ''}
                    <button onclick="deleteCandidate(${c.id})" class="text-red-600 hover:underline">Delete</button>
                  </td>
                </tr>`).join('') || `<tr><td colspan="3" class="text-gray-400 py-1">No candidates yet</td></tr>`}
            </tbody>
          </table>
        </div>
      `).join('') || '<p class="text-gray-400 text-sm">No job requisitions yet</p>'}
    </div>
  `;
}

async function updateRequisitionStatus(id, status) {
  if (!status) return;
  try { await api(`/recruitment/requisitions/${id}`, { method: 'PUT', body: JSON.stringify({ status }) }); render(); }
  catch (e) { toast(e.message, true); }
}
function deleteRequisition(id) {
  confirmRun('Delete this requisition and all its candidates?', () => api(`/recruitment/requisitions/${id}`, { method: 'DELETE' }));
}
async function addCandidate(ev, reqId) {
  ev.preventDefault();
  const fd = Object.fromEntries(new FormData(ev.target));
  try {
    await api(`/recruitment/requisitions/${reqId}/candidates`, { method: 'POST', body: JSON.stringify(fd) });
    toast('Candidate added');
    render();
  } catch (e) { toast(e.message, true); }
}
async function updateCandidateStage(id, stage) {
  try { await api(`/recruitment/candidates/${id}`, { method: 'PUT', body: JSON.stringify({ stage }) }); render(); }
  catch (e) { toast(e.message, true); }
}
function deleteCandidate(id) {
  confirmRun('Delete this candidate?', () => api(`/recruitment/candidates/${id}`, { method: 'DELETE' }));
}
async function hireCandidate(id) {
  const employmentType = prompt('Employment type for hire (Full-time/Part-time/Contractor/Intern):', 'Full-time');
  if (!employmentType) return;
  try {
    await api(`/recruitment/candidates/${id}/hire`, { method: 'POST', body: JSON.stringify({ employment_type: employmentType }) });
    toast('Candidate hired — employee record created');
    render();
  } catch (e) { toast(e.message, true); }
}
window.updateRequisitionStatus = updateRequisitionStatus;
window.deleteRequisition = deleteRequisition;
window.addCandidate = addCandidate;
window.updateCandidateStage = updateCandidateStage;
window.deleteCandidate = deleteCandidate;
window.hireCandidate = hireCandidate;

function attachReqForm() {
  const f = document.getElementById('reqForm');
  if (!f) return;
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(f));
    try {
      await api('/recruitment/requisitions', { method: 'POST', body: JSON.stringify(fd) });
      toast('Requisition created');
      render();
    } catch (err) { toast(err.message, true); }
  });
}

// ============ PERFORMANCE ============
async function performanceView() {
  const isManagerHR = ['Manager', 'HRAdmin', 'SystemAdmin'].includes(state.user.role);
  const cycles = await api('/performance/cycles');
  let employees = [];
  if (isManagerHR) employees = await api('/employees');
  const myGoals = state.employee ? await api(`/performance/goals/${state.employee.id}`) : [];
  const myReviews = state.employee ? await api(`/performance/reviews/${state.employee.id}`) : [];

  return `
    ${isManagerHR ? `
    <div class="card p-5 mb-4">
      <div class="flex justify-between items-center mb-3">
        <h3 class="font-semibold">Review Cycles</h3>
      </div>
      <form id="cycleForm" class="grid sm:grid-cols-4 gap-2 mb-3">
        <input name="name" placeholder="Cycle name" required class="border rounded-lg px-3 py-2 text-sm">
        <select name="cycle_type" class="border rounded-lg px-3 py-2 text-sm">
          <option>Quarterly</option><option>Annual</option><option>Internship</option>
        </select>
        <input name="start_date" type="date" class="border rounded-lg px-3 py-2 text-sm">
        <input name="end_date" type="date" class="border rounded-lg px-3 py-2 text-sm">
        <button class="sm:col-span-4 btn-primary py-2">Create Cycle</button>
      </form>
      <div class="flex flex-wrap gap-2">
        ${cycles.map(c => `<div class="text-xs bg-gray-50 rounded-lg px-3 py-2 flex items-center gap-2">${c.name} (${c.cycle_type}) <button onclick="deleteCycle(${c.id})" class="text-red-600 hover:underline">×</button></div>`).join('') || '<p class="text-gray-400 text-sm">No cycles yet</p>'}
      </div>
    </div>

    <div class="card p-5 mb-4">
      <h3 class="font-semibold mb-3">Assign a Goal</h3>
      <form id="goalForm" class="grid sm:grid-cols-4 gap-2">
        <select name="employee_id" required class="border rounded-lg px-3 py-2 text-sm">
          ${employees.map(e => `<option value="${e.id}">${e.full_name}</option>`).join('')}
        </select>
        <select name="cycle_id" class="border rounded-lg px-3 py-2 text-sm">
          <option value="">Cycle (optional)</option>
          ${cycles.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
        </select>
        <input name="title" placeholder="Goal title" required class="border rounded-lg px-3 py-2 text-sm sm:col-span-2">
        <button class="sm:col-span-4 btn-primary py-2">Assign Goal</button>
      </form>
    </div>

    <div class="card p-5 mb-4">
      <h3 class="font-semibold mb-3">Intern Evaluation (simplified end-of-internship review)</h3>
      <form id="internEvalForm" class="grid sm:grid-cols-4 gap-2">
        <select name="employee_id" required class="border rounded-lg px-3 py-2 text-sm sm:col-span-2">
          ${employees.filter(e => e.employment_type === 'Intern').map(e => `<option value="${e.id}">${e.full_name}</option>`).join('') || '<option value="">No interns</option>'}
        </select>
        <input name="rating" type="number" step="0.1" min="0" max="5" placeholder="Rating (0-5)" class="border rounded-lg px-3 py-2 text-sm">
        <button class="btn-primary py-2">Submit</button>
        <textarea name="feedback" placeholder="Feedback" class="sm:col-span-4 border rounded-lg px-3 py-2 text-sm" rows="2"></textarea>
      </form>
    </div>
    ` : ''}

    ${state.employee ? `
    <div class="card p-5 mb-4">
      <h3 class="font-semibold mb-3">My Goals</h3>
      <div class="space-y-2">
        ${myGoals.map(g => `
          <div class="border-b pb-2 flex justify-between items-center">
            <div>
              <p class="text-sm font-medium">${g.title}</p>
              <p class="text-xs text-gray-500">${g.description || ''}</p>
            </div>
            <select onchange="updateGoalStatus(${g.id}, this.value)" class="text-xs border rounded-lg px-2 py-1">
              ${['Not-started','In-progress','Completed'].map(s => `<option value="${s}" ${g.status===s?'selected':''}>${s}</option>`).join('')}
            </select>
          </div>`).join('') || '<p class="text-gray-400 text-sm">No goals assigned yet</p>'}
      </div>
    </div>
    <div class="card p-5">
      <h3 class="font-semibold mb-3">My Self-Assessment</h3>
      <form id="selfAssessForm" class="space-y-2">
        <select name="cycle_id" class="w-full border rounded-lg px-3 py-2 text-sm">
          ${cycles.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
        </select>
        <textarea name="self_assessment" placeholder="How did this cycle go for you?" rows="3" class="w-full border rounded-lg px-3 py-2 text-sm"></textarea>
        <button class="btn-primary">Submit Self-Assessment</button>
      </form>
      <div class="mt-4 space-y-2">
        ${myReviews.map(r => `
          <div class="border-t pt-2 text-sm">
            <p><b>Status:</b> ${r.status}</p>
            ${r.manager_rating ? `<p><b>Manager rating:</b> ${r.manager_rating}/5</p>` : ''}
            ${r.manager_feedback ? `<p class="text-gray-500">${r.manager_feedback}</p>` : ''}
          </div>`).join('')}
      </div>
    </div>` : ''}
  `;
}

function deleteCycle(id) {
  confirmRun('Delete this review cycle?', () => api(`/performance/cycles/${id}`, { method: 'DELETE' }));
}
async function updateGoalStatus(id, status) {
  try { await api(`/performance/goals/${id}`, { method: 'PUT', body: JSON.stringify({ status }) }); render(); }
  catch (e) { toast(e.message, true); }
}
window.deleteCycle = deleteCycle;
window.updateGoalStatus = updateGoalStatus;

function attachPerformanceForms() {
  const cycleForm = document.getElementById('cycleForm');
  if (cycleForm) cycleForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(cycleForm));
    try { await api('/performance/cycles', { method: 'POST', body: JSON.stringify(fd) }); toast('Cycle created'); render(); }
    catch (err) { toast(err.message, true); }
  });
  const goalForm = document.getElementById('goalForm');
  if (goalForm) goalForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(goalForm));
    if (!fd.cycle_id) delete fd.cycle_id;
    try { await api('/performance/goals', { method: 'POST', body: JSON.stringify(fd) }); toast('Goal assigned'); render(); }
    catch (err) { toast(err.message, true); }
  });
  const internEvalForm = document.getElementById('internEvalForm');
  if (internEvalForm) internEvalForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(internEvalForm));
    fd.rating = fd.rating ? parseFloat(fd.rating) : null;
    try { await api('/performance/intern-evaluations', { method: 'POST', body: JSON.stringify(fd) }); toast('Evaluation submitted'); render(); }
    catch (err) { toast(err.message, true); }
  });
  const selfAssessForm = document.getElementById('selfAssessForm');
  if (selfAssessForm) selfAssessForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(selfAssessForm));
    try { await api('/performance/reviews', { method: 'POST', body: JSON.stringify(fd) }); toast('Self-assessment submitted'); render(); }
    catch (err) { toast(err.message, true); }
  });
}

// ============ SETTINGS (HR Admin / SystemAdmin) ============
async function settingsView() {
  const isSystemAdmin = state.user.role === 'SystemAdmin';
  const [depts, desigs, locs, skills, policies] = await Promise.all([
    api('/admin/departments'), api('/admin/designations'), api('/admin/locations'),
    api('/admin/skills'), api('/leave/policies')
  ]);

  function lookupSection(title, table, items, nameField) {
    return `
      <div class="card p-5">
        <h3 class="font-semibold mb-3">${title}</h3>
        <form onsubmit="addLookup(event, '${table}', '${nameField}')" class="flex gap-2 mb-3">
          <input name="${nameField}" placeholder="New ${title.toLowerCase().slice(0,-1)}" required class="border rounded-lg px-3 py-2 text-sm flex-1">
          <button class="btn-primary">Add</button>
        </form>
        <div class="space-y-1 max-h-56 overflow-y-auto">
          ${items.map(i => `
            <div class="flex justify-between items-center text-sm border-b py-1.5">
              <span>${i[nameField]}</span>
              <span class="flex gap-2">
                <button onclick="editLookup('${table}', ${i.id}, '${nameField}', '${esc(i[nameField])}')" class="text-xs text-blue-600 hover:underline">Edit</button>
                <button onclick="deleteLookup('${table}', ${i.id})" class="text-xs text-red-600 hover:underline">Delete</button>
              </span>
            </div>`).join('') || '<p class="text-gray-400 text-xs">None yet</p>'}
        </div>
      </div>
    `;
  }

  return `
    <div class="grid md:grid-cols-2 gap-4 mb-4">
      ${lookupSection('Departments', 'departments', depts, 'name')}
      ${lookupSection('Designations', 'designations', desigs, 'title')}
      ${lookupSection('Locations', 'locations', locs, 'name')}
      ${lookupSection('Skills', 'skills', skills, 'name')}
    </div>

    <div class="card p-5 mb-4">
      <h3 class="font-semibold mb-3">Leave Policies</h3>
      <form id="policyCreateForm" class="grid sm:grid-cols-6 gap-2 mb-3">
        <input name="name" placeholder="Policy name" required class="border rounded-lg px-3 py-2 text-sm sm:col-span-2">
        <select name="applies_to" class="border rounded-lg px-3 py-2 text-sm">
          <option value="Standard">Standard</option>
          <option value="Intern">Intern</option>
        </select>
        <input name="annual_days" type="number" placeholder="Annual" class="border rounded-lg px-3 py-2 text-sm">
        <input name="sick_days" type="number" placeholder="Sick" class="border rounded-lg px-3 py-2 text-sm">
        <input name="casual_days" type="number" placeholder="Casual" class="border rounded-lg px-3 py-2 text-sm">
        <button class="sm:col-span-6 btn-primary py-2">Add Policy</button>
      </form>
      <table class="w-full text-sm">
        <thead><tr class="text-left text-gray-500"><th class="pb-2">Name</th><th>Applies To</th><th>Annual</th><th>Sick</th><th>Casual</th><th></th></tr></thead>
        <tbody>
          ${policies.map(p => `
            <tr class="border-t">
              <td class="py-1.5">${p.name}</td><td>${p.applies_to}</td><td>${p.annual_days}</td><td>${p.sick_days}</td><td>${p.casual_days}</td>
              <td>
                <button onclick="editLeavePolicy(${p.id}, ${p.annual_days}, ${p.sick_days}, ${p.casual_days})" class="text-xs text-blue-600 hover:underline">Edit</button>
                <button onclick="deleteLeavePolicy(${p.id})" class="text-xs text-red-600 hover:underline ml-2">Delete</button>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>

    ${isSystemAdmin ? `
    <div class="card p-5">
      <h3 class="font-semibold mb-3">Audit Log (latest 50)</h3>
      <div id="auditLogBox" class="text-xs space-y-1 max-h-96 overflow-y-auto">Loading...</div>
    </div>` : ''}
  `;
}

async function loadAuditLog() {
  const box = document.getElementById('auditLogBox');
  if (!box) return;
  try {
    const audit = await api('/admin/audit-logs');
    box.innerHTML = audit.slice(0, 50).map(a => `<div class="border-b py-1"><b>${a.action}</b> by ${a.user_email || 'system'} <span class="text-gray-400">— ${new Date(a.created_at).toLocaleString()}</span></div>`).join('') || '<p class="text-gray-400">No activity yet</p>';
  } catch (e) { box.innerHTML = `<p class="text-red-600">${e.message}</p>`; }
}

async function addLookup(ev, table, nameField) {
  ev.preventDefault();
  const fd = Object.fromEntries(new FormData(ev.target));
  try {
    await api(`/admin/${table}`, { method: 'POST', body: JSON.stringify(fd) });
    toast('Added');
    render();
  } catch (e) { toast(e.message, true); }
}
function editLookup(table, id, nameField, current) {
  const val = prompt('Edit value:', current);
  if (val === null || val === current) return;
  confirmRun('Save change?', () => api(`/admin/${table}/${id}`, { method: 'PUT', body: JSON.stringify({ [nameField]: val }) }));
}
function deleteLookup(table, id) {
  confirmRun('Delete this entry? Employees using it will just have it unset, not be deleted.', () => api(`/admin/${table}/${id}`, { method: 'DELETE' }));
}
function editLeavePolicy(id, annual, sick, casual) {
  const a = prompt('Annual days:', annual); if (a === null) return;
  const s = prompt('Sick days:', sick); if (s === null) return;
  const c = prompt('Casual days:', casual); if (c === null) return;
  confirmRun('Save policy changes?', () => api(`/leave/policies/${id}`, {
    method: 'PUT', body: JSON.stringify({ annual_days: parseFloat(a), sick_days: parseFloat(s), casual_days: parseFloat(c) })
  }));
}
function deleteLeavePolicy(id) {
  confirmRun('Delete this leave policy?', () => api(`/leave/policies/${id}`, { method: 'DELETE' }));
}
window.addLookup = addLookup;
window.editLookup = editLookup;
window.deleteLookup = deleteLookup;
window.editLeavePolicy = editLeavePolicy;
window.deleteLeavePolicy = deleteLeavePolicy;

function attachSettingsForms() {
  const f = document.getElementById('policyCreateForm');
  if (f) f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(f));
    try {
      await api('/leave/policies', { method: 'POST', body: JSON.stringify(fd) });
      toast('Policy added');
      render();
    } catch (err) { toast(err.message, true); }
  });
  loadAuditLog();
}

// ============ FINANCE (Compensation) ============
async function financeView() {
  const employees = await api('/employees');
  return `
    <div class="card p-5">
      <h3 class="font-semibold mb-3">Compensation Reference (View/Update)</h3>
      <p class="text-xs text-gray-500 mb-3">Finance manages basic salary/stipend reference data only — payroll processing is done by HR Admin.</p>
      <div class="space-y-2">
        ${employees.map(e => `
          <div class="border rounded-lg p-3 flex justify-between items-center">
            <div><b>${e.full_name}</b> ${badge(e.employment_type, 'badge-' + e.employment_type)}</div>
            <button onclick="editComp(${e.id}, '${e.employment_type}')" class="text-xs text-blue-600 hover:underline">Edit Comp.</button>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

async function editComp(id, type) {
  let field = 'basic_salary';
  if (type === 'Intern') field = 'stipend_amount';
  if (type === 'Contractor') field = 'contractor_rate';
  const val = prompt(`Enter ${field.replace('_', ' ')}:`);
  if (val === null) return;
  try {
    await api(`/payroll/compensation/${id}`, { method: 'POST', body: JSON.stringify({ [field]: parseFloat(val) || 0, currency: 'PKR' }) });
    toast('Updated');
  } catch (e) { toast(e.message, true); }
}
window.editComp = editComp;

// ============ REIMBURSEMENTS (Finance/HR review queue) ============
async function reimbursementsView() {
  const items = await api('/projects/reimbursements');
  return `
    <div class="card p-5">
      <h3 class="font-semibold mb-3">Reimbursement Claims</h3>
      <table class="w-full text-sm">
        <thead><tr class="text-left text-gray-500"><th class="pb-2">Employee</th><th>Project</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
          ${items.map(r => `
            <tr class="border-t">
              <td class="py-1.5">${r.full_name}</td><td>${r.project_name || '-'}</td><td>${r.amount}</td><td>${badge(r.status, 'badge-' + r.status)}</td>
              <td>
                ${r.status === 'Pending' ? `<button onclick="reviewReimb(${r.id},'Approved')" class="text-xs text-green-600 hover:underline mr-2">Approve</button><button onclick="reviewReimb(${r.id},'Rejected')" class="text-xs text-red-600 hover:underline">Reject</button>` : ''}
                ${r.status === 'Approved' ? `<button onclick="reviewReimb(${r.id},'Paid')" class="text-xs text-blue-600 hover:underline">Mark Paid</button>` : ''}
              </td>
            </tr>
          `).join('') || '<tr><td colspan="5" class="text-gray-400 py-2">No claims</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}
async function reviewReimb(id, status) {
  try { await api(`/projects/reimbursements/${id}`, { method: 'PUT', body: JSON.stringify({ status }) }); render(); }
  catch (e) { toast(e.message, true); }
}
window.reviewReimb = reviewReimb;

// ============ USERS (SystemAdmin) ============
async function usersView() {
  const [users, employees] = await Promise.all([api('/auth/users'), api('/employees')]);
  return `
    <div class="card p-5 mb-4">
      <h3 class="font-semibold mb-3">Create User Account</h3>
      <form id="userForm" class="grid sm:grid-cols-4 gap-2">
        <input name="email" type="email" placeholder="Email" required class="border rounded-lg px-3 py-2 text-sm">
        <input name="password" type="password" placeholder="Password" required class="border rounded-lg px-3 py-2 text-sm">
        <select name="role" class="border rounded-lg px-3 py-2 text-sm">
          ${['Employee','Manager','HRAdmin','SystemAdmin','FinanceOfficer'].map(r => `<option>${r}</option>`).join('')}
        </select>
        <select name="employee_id" class="border rounded-lg px-3 py-2 text-sm">
          <option value="">Link to employee (optional)</option>
          ${employees.map(e => `<option value="${e.id}">${e.full_name}</option>`).join('')}
        </select>
        <button class="sm:col-span-4 btn-primary py-2">Create User</button>
      </form>
    </div>
    <div class="card p-5">
      <h3 class="font-semibold mb-3">All User Accounts</h3>
      <table class="w-full text-sm">
        <thead><tr class="text-left text-gray-500"><th class="pb-2">Email</th><th>Role</th><th>Active</th><th></th></tr></thead>
        <tbody>
          ${users.map(u => `
            <tr class="border-t">
              <td class="py-1.5">${u.email}</td>
              <td>
                <select onchange="updateUserRole(${u.id}, this.value)" class="border rounded px-2 py-1 text-xs">
                  ${['Employee','Manager','HRAdmin','SystemAdmin','FinanceOfficer'].map(r => `<option ${u.role===r?'selected':''}>${r}</option>`).join('')}
                </select>
              </td>
              <td>
                <button onclick="toggleUserActive(${u.id}, ${!u.is_active})" class="text-xs ${u.is_active ? 'text-green-600' : 'text-gray-400'} hover:underline">${u.is_active ? 'Active' : 'Inactive'}</button>
              </td>
              <td><button onclick="deleteUser(${u.id})" class="text-xs text-red-600 hover:underline">Delete</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}
async function updateUserRole(id, role) {
  try { await api(`/auth/users/${id}`, { method: 'PUT', body: JSON.stringify({ role }) }); toast('Role updated'); }
  catch (e) { toast(e.message, true); render(); }
}
async function toggleUserActive(id, newVal) {
  try { await api(`/auth/users/${id}`, { method: 'PUT', body: JSON.stringify({ is_active: newVal }) }); render(); }
  catch (e) { toast(e.message, true); }
}
function deleteUser(id) {
  confirmRun('Delete this user account? (Employee record is kept.)', () => api(`/auth/users/${id}`, { method: 'DELETE' }));
}
window.updateUserRole = updateUserRole;
window.toggleUserActive = toggleUserActive;
window.deleteUser = deleteUser;

function attachUserForm() {
  const f = document.getElementById('userForm');
  if (!f) return;
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(f));
    if (!fd.employee_id) delete fd.employee_id;
    try {
      await api('/auth/users', { method: 'POST', body: JSON.stringify(fd) });
      toast('User created');
      render();
    } catch (err) { toast(err.message, true); }
  });
}

// ============ ROUTER ============
async function renderContent() {
  const contentEl = document.getElementById('content-slot');
  if (!contentEl) return;
  contentEl.innerHTML = '<div class="text-center py-12 text-gray-400">Loading...</div>';
  let html = '';
  try {
    switch (state.tab) {
      case 'dashboard': html = await dashboardView(); break;
      case 'attendance': html = await attendanceView(); break;
      case 'leave': html = await leaveView(); break;
      case 'projects': html = await projectsView(); break;
      case 'tasks': html = await tasksView(); break;
      case 'payslips': html = await payslipsView(); break;
      case 'hrdesk': html = await hrdeskView(); break;
      case 'team': html = await teamView(); break;
      case 'approvals': html = await approvalsView(); break;
      case 'employees': html = await employeesView(); break;
      case 'recruitment': html = await recruitmentView(); break;
      case 'performance': html = await performanceView(); break;
      case 'payroll': html = await payrollView(); break;
      case 'reports': html = await reportsView(); break;
      case 'settings': html = await settingsView(); break;
      case 'finance': html = await financeView(); break;
      case 'reimbursements': html = await reimbursementsView(); break;
      case 'users': html = await usersView(); break;
      default: html = '<p>Not found</p>';
    }
  } catch (e) {
    html = `<div class="card p-6 text-red-600">Error: ${e.message}</div>`;
  }
  contentEl.innerHTML = html;
  attachCorrectionForm();
  attachLeaveForm();
  attachTimeLogForm();
  attachReimbForm();
  attachProjForm();
  attachTaskForm();
  attachTicketForm();
  attachAnnForm();
  attachPolicyForm();
  attachPayrollRunForm();
  attachReqForm();
  attachPerformanceForms();
  attachSettingsForms();
  attachUserForm();
}

async function render() {
  const el = document.getElementById('app');
  if (!state.token) { loginScreen(); return; }
  if (!state.user) {
    try { await loadMe(); } catch (e) { loginScreen(); return; }
  }
  el.innerHTML = shell('<div id="content-slot"></div>');
  startNotificationPolling();
  await renderContent();
}

render();
</script>
</body>
</html>
